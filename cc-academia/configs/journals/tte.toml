# IEEE Transactions on Transportation Electrification.
journal = "IEEE Transactions on Transportation Electrification"

# Conflict windows are inherited from coi.toml. This file used to narrow the
# co-authorship window to four years, which made TTE *more* permissive than the
# shared default and let a collaborator from five years ago through unflagged.
# Nothing recorded why, so it is gone; a journal that genuinely wants a
# narrower window has to state a reason next to it, and a test refuses a
# silent one.

# Under ten years into an independent career, and no floor. The rule TTE wants
# is a preference for early-career reviewers, and it cannot exclude anybody —
# the rule enforces that regardless of the mode here, which is the lesson of
# the run where this was `require` and removed every senior researcher in the
# pool, leaving nobody to invite.
#
# The shared default keeps a three-year floor, for "too soon after the
# doctorate". Dropped here because the case it guards against is already a hard
# gate elsewhere: [seniority.doctoral] excludes a PhD student before their
# third year outright, and a floor that only costs score cannot add to that.
# Stating both bounds would also have put "between 3 and 10 years" on the
# workbook heading, which is not the rule an editor set.
[seniority]
mode = "prefer"
min_years = 0
max_years = 10

[activity]
mode = "require"
recent_years = 3
min_recent_papers = 1

[activity.relevant]
mode = "require"
recent_years = 3
min_recent_papers = 1

# Three journal papers on the manuscript's topic. This is the floor that does
# most of the work on a TTE run: the pool is harvested from a literature search,
# so almost everyone in it is relevant, and what separates a reviewer from a
# name on a conference paper is having carried the topic through peer review.
[activity.related_journals]
mode = "require"
min_publications = 3

[geo.restricted]
mode = "require"
countries = ["IN", "IR"]

# Eligibility overlays go here, table by table — state only what changes:
#
# [activity]
# recent_years = 5
#
# [seniority.doctoral]
# min_year = 4

# Default conflict-of-interest policy.
#
# The engine that reads this file is purely deterministic: no model decides
# whether a conflict exists. A journal may override any key by dropping a file
# into configs/journals/, or a user may override the whole directory via
# ACADEMIA_CONFIG_DIR.
#
# Wording is fixed everywhere: a clear result is reported as "no detected
# conflict", never "no conflict". A bibliographic database cannot prove the
# absence of a personal, financial or competitive relationship.

[windows]
# Co-authorship within this many years is disqualifying.
coauthor_years = 5
# Collaborations older than the window still raise a flag once they are dense.
historic_collaboration_papers = 3
# A shared doctoral institution matters when the two overlapped in time.
shared_institution_overlap_years = 3

[rules]
# Hard exclusions. A BLOCK is not a penalty — the candidate is removed from
# consideration and never re-enters through a high expertise score.
block = [
  "manuscript_author",
  "exclusion_list",
  "recent_coauthor",
  "same_department",
  "same_phd_institution_overlap",
  "advisor_advisee",
]

# Flags for the editor to judge. These stay in the shortlist, marked.
review = [
  "same_institution",
  "previous_institution_overlap",
  "dense_historic_collaboration",
  "heavily_cited_by_manuscript",
]

[thresholds]
# References to a candidate's work above this count suggest closeness worth noting.
heavily_cited_by_manuscript = 3

[geo]
# Cross-region preference operates on the candidate's *current affiliation
# country*, never on nationality or on any inference from a name.
mode = "prefer_cross_region"   # or "hard_filter" or "off"
bonus = 0.08

[seniority]
# Years since the doctorate. Unknown never excludes anybody — ORCID fills the
# education section for roughly 30% of researchers in this field.
min_academic_age = 3
max_academic_age = 0           # 0 means no upper bound

[seniority.career]
mode = "off"
max_years = 10

# Doctoral candidates. The pool is harvested from authorship, so it contains
# students by construction, and a late-stage one can be the right reviewer on a
# narrow topic. The floor is the year of study, counted from the enrolment year
# on the education record: 3 means "third year or later".
[seniority.doctoral]
mode = "require"               # off | prefer | require
min_year = 3
# A student whose enrolment year is nowhere stated is kept and marked, and that
# is not configurable: turning a gap in ORCID into an exclusion would remove the
# candidates with the thinnest records rather than the ones who are too junior.

# Every constraint below follows the same three modes:
#   off      — not evaluated at all
#   prefer   — feeds the score and adds a note; nobody is removed
#   require  — the candidate is excluded, and stays on the list with the reason
[activity]
# Still publishing: works within the window, counted from the candidate's own
# bibliographic profile rather than from the papers this run harvested. Counting
# the harvest would ask a different question and call a prolific author dormant
# because their latest work is not on this manuscript's topic.
mode = "prefer"
recent_years = 3
min_recent_papers = 1

[activity.relevant]
mode = "prefer"
recent_years = 3
min_recent_papers = 1

[activity.invitations]
# Responsiveness to review invitations, read from the accumulating store — every
# manuscript it holds, not just this workspace. Empty history is neutral: a
# candidate nobody has invited yet is not unresponsive, and the first run has no
# history at all. Only invitations whose outcome was actually recorded count;
# one still pending is not a silence.
mode = "prefer"
recent_years = 3
min_invitations = 1            # resolved outcomes; below this, too thin to judge
min_response_rate = 0.5        # responses / invitations inside the window

# The senior expert who no longer takes review work. Career length alone never
# excludes anyone: the rule fires only when a long career *and* a record of
# unanswered invitations coincide.
[activity.veteran]
mode = "require"
career_years = 10              # years since the first publication on record
min_invitations = 2            # resolved outcomes, all-time rather than windowed
max_response_rate = 0.0        # at or below this, treat as not accepting work

[scoring]
topic = 0.35
method = 0.20
recent_expertise = 0.15
publication_evidence = 0.10
geographic = 0.08
reviewer_history = 0.05
activity = 0.07

# Retrieval and enrichment mechanics use the same journal overlay loader as
# policy, but remain isolated in their own table. Keeping one resolved config
# prevents a journal's search breadth and contact budget from drifting apart.
# Module constants remain the fallback when a personal override omits a key.
[retrieval]
candidate_pool = 300
top_papers = 50
max_papers_per_candidate = 10
pdf_front_pages = 30
page_request_delay = 1.0
host_failure_budget = 2
max_page_bytes = 1000000

# Lowest to highest precedence. These defaults preserve the editor's explicit
# choice to keep a published corresponding address above a staff-page address.
email_precedence = [
  "orcid_public",
  "lab_homepage",
  "published_author",
  "institutional_profile",
  "published_corresponding",
]

[retrieval.email_confidence]
orcid_public = 0.65
lab_homepage = 0.75
published_author = 0.85
institutional_profile = 0.90
published_corresponding = 0.95

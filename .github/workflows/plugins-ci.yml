name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test JavaScript plugins and generated artifacts
        run: >-
          node --test fabric/tests/*.test.mjs rem/tests/*.test.mjs
          sharp-review/tests/*.test.mjs evolve/tests/*.test.mjs
          traceme/tests/*.test.mjs cc-latex/tests/*.test.mjs
          shared/tests/*.test.mjs tests/*.test.mjs
      - name: Validate release shell scripts
        run: bash -n scripts/git-hooks/pre-commit scripts/git-hooks/pre-push scripts/release.sh
      - name: Verify committed Codex artifacts are fresh
        run: |
          node scripts/gen-codex.mjs .
          git diff --exit-code -- .agents/plugins/ '*/.codex-plugin/'

  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install watch dependencies
        run: python -m pip install --require-hashes -r watch/requirements.lock
      - name: Test watch
        run: python -m unittest discover watch/tests/

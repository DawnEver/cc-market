# Rendered by dev_lab.dev.ciworkflows from TOML (dev_lab/dev/ci_base.toml + [tool.dev_lab.ci] in pyproject.toml). Hand edits are refused; edit the TOML and run `python -m dev_lab.dev.ciworkflows render`.
{
  "name": "cc-academia",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-latest",
      "defaults": {
        "run": {
          "working-directory": "cc-academia"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync",
          "run": "uv sync --all-extras --no-install-package paper-pdf-ingest"
        },
        {
          "name": "Lint",
          "run": "uv run ruff check ."
        },
        {
          "name": "Test",
          "run": "uv run python -m pytest -q"
        }
      ],
      "if": "${{ (!(github.event.pull_request.draft || startsWith(github.event.pull_request.title, 'WIP:') || startsWith(github.event.pull_request.title, '[WIP]'))) }}"
    },
    "secrets": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "gitleaks/gitleaks-action@v2",
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        }
      ],
      "if": "${{ (!(github.event.pull_request.draft || startsWith(github.event.pull_request.title, 'WIP:') || startsWith(github.event.pull_request.title, '[WIP]'))) }}"
    }
  }
}

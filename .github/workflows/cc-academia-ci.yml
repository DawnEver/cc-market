name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The plugin is one directory of a multi-plugin repository, and the root has
    # no pyproject.toml. Without this every uv step fails with "No
    # `pyproject.toml` found in current directory or any parent directory".
    defaults:
      run:
        working-directory: cc-academia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras --no-install-package paper-pdf-ingest

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The repository is public and the fixtures are captured from live APIs, so
      # a leaked key would be world-readable the moment it lands.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

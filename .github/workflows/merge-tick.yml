# Rendered by dev_lab.dev.ciworkflows from TOML (dev_lab/dev/ci_base.toml + [tool.dev_lab.ci] in pyproject.toml). Hand edits are refused; edit the TOML and run `python -m dev_lab.dev.ciworkflows render`.
{
  "name": "Merge tick",
  "on": {
    "status": {},
    "schedule": [
      {
        "cron": "*/15 * * * *"
      }
    ],
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "merge-tick",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "HEAD_SHA": "${{ github.sha }}",
    "FAMILY_SOURCE": "${{ github.server_url }}/${{ github.repository_owner }}/"
  },
  "jobs": {
    "merge-tick": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "if": "${{ github.event_name != 'status' || (startsWith(github.event.context, 'tests/') && github.event.context != 'tests/merge-ready' && github.event.state != 'pending') }}",
      "runs-on": "ubuntu-latest",
      "outputs": {
        "due": "${{ steps.ready.outputs.due }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "id": "ready",
          "name": "tests/merge-ready",
          "run": "said=\"$(uv run --no-sync python -m dev_lab.dev.forge merge ready)\"; echo \"$said\"; case \"$said\" in *\"; merged\"*) echo \"merged=true\" >> \"$GITHUB_OUTPUT\" ;; esac; case \"$said\" in *\"; review due\"*) echo \"due=true\" >> \"$GITHUB_OUTPUT\" ;; esac"
        },
        {
          "name": "Run CI on the merged integration",
          "if": "${{ steps.ready.outputs.merged == 'true' }}",
          "run": "gh workflow run ci.yml --repo \"$GITHUB_REPOSITORY\" --ref integrate/main -f smoke=true",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Prune the records home",
          "if": "${{ !cancelled() && github.event_name != 'status' }}",
          "run": "uv run --no-sync python -m dev_lab.dev.forge records prune"
        }
      ],
      "permissions": {
        "contents": "write",
        "statuses": "write",
        "pull-requests": "write",
        "actions": "write"
      }
    }
  }
}

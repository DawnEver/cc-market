<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fabric console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>fabric console</h1>
  <span id="healthDot" title="fleet health"></span>
  <span id="headerStats">…</span>
  <nav id="tabs">
    <button class="tab" data-action="goto" data-view="fleet">Fleet <span id="tabAttn" class="tabBadge"></span></button>
    <button class="tab" data-action="goto" data-view="sessions">Sessions</button>
    <button class="tab" data-action="goto" data-view="chat">Chat</button>
  </nav>
  <span id="asOf" class="dim"></span>
</header>
<!-- The conveyor: machines → sessions → chat. The focused stage holds 80% of the
     width; the stage above it stays as a 20% context rail (fleet keeps a sessions
     preview instead). The split bar drags; each stage remembers its own ratio.
     Pane skeletons mount once per stage entry; polls patch sub-containers only. -->
<main id="split">
  <div id="paneL"></div>
  <div id="splitBar" title="drag to resize — each stage remembers its ratio"></div>
  <div id="paneR"></div>
</main>
<div id="toasts"></div>
<script type="module" src="/main.js"></script>
</body>
</html>

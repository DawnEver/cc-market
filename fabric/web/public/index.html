<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fabric console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>fabric console</h1>
  <span id="healthDot" title="fleet health"></span>
  <span id="headerStats">…</span>
  <nav id="tabs">
    <button class="tab" data-action="goto" data-view="fleet">Fleet <span id="tabAttn" class="tabBadge"></span></button>
    <button class="tab" data-action="goto" data-view="sessions">Sessions</button>
    <button class="tab" data-action="goto" data-view="chat">Chat</button>
  </nav>
  <span id="asOf" class="dim"></span>
</header>
<!-- One view at a time: the operator's workflow is a funnel (fleet → sessions → chat),
     so each stage gets the full width. View skeletons are built by main.js; polls patch
     sub-containers only, so form controls and scroll positions survive. -->
<main id="view"></main>
<div id="toasts"></div>
<script type="module" src="/main.js"></script>
</body>
</html>

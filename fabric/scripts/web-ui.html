<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fabric console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --accent:#58a6ff; --ok:#3fb950; --bad:#f85149; --human:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 "Segoe UI", system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:8px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:15px; margin:0; color:var(--accent); }
  header span { color:var(--dim); font-size:12px; }
  main { flex:1; display:grid; grid-template-columns: 270px 320px 1fr; min-height:0; }
  section { border-right:1px solid var(--border); overflow-y:auto; padding:10px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:6px 0; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin-bottom:8px; }
  .card b { color:var(--fg); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .dim { color:var(--dim); font-size:12px; }
  .sess { cursor:pointer; }
  .sess.sel { border-color:var(--accent); }
  .sess .row { display:flex; justify-content:space-between; gap:6px; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:5px;
           padding:3px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  input, select { background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:5px;
                  padding:4px 8px; font-size:12px; width:100%; margin-bottom:6px; }
  form label { font-size:11px; color:var(--dim); }
  .inline { display:flex; gap:8px; } .inline > * { flex:1; }
  #chat { display:flex; flex-direction:column; min-height:0; border-right:none; }
  #msgs { flex:1; overflow-y:auto; padding:4px; }
  .msg { max-width:78%; margin:6px 0; padding:8px 12px; border-radius:8px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:#1f6feb22; border:1px solid #1f6feb55; margin-left:auto; }
  .msg.assistant { background:var(--panel); border:1px solid var(--border); }
  .msg.human { background:#d2992222; border:1px solid #d2992255; margin-left:auto; }
  .msg .who { font-size:10px; color:var(--dim); margin-bottom:2px; }
  #composer { display:flex; gap:8px; padding:10px; border-top:1px solid var(--border); }
  #composer input { flex:1; margin:0; }
  #chatEmpty { color:var(--dim); text-align:center; margin-top:40px; }
  details summary { cursor:pointer; color:var(--dim); font-size:12px; margin-bottom:4px; }
  .spin { opacity:.55; }
</style>
</head>
<body>
<header><h1>fabric console</h1><span>local · session-bound · closing the terminal stops it</span></header>
<main>
  <section id="nodesPane">
    <h2>Fleet</h2>
    <div id="nodes" class="dim">probing…</div>
    <h2>Journal orphans</h2>
    <div id="orphans" class="dim">—</div>
  </section>

  <section id="sessPane">
    <h2>Spawn</h2>
    <form id="spawnForm" class="card" onsubmit="return false">
      <div class="inline">
        <div><label>provider</label><input name="provider" value="deepseek"></div>
        <div><label>model</label><input name="model" value="haiku"></div>
      </div>
      <div class="inline">
        <div><label>effort</label>
          <select name="effort"><option value="">default</option><option>low</option><option>medium</option><option>high</option><option>max</option></select></div>
        <div><label>node (blank = local)</label><input name="node" placeholder="G / WS1 / WS2"></div>
      </div>
      <details><summary>more (project · profile · flags)</summary>
        <label>project alias (remote)</label><input name="project" placeholder="motronics-studio">
        <label>profile</label><input name="profile" placeholder="named profile">
        <div class="inline">
          <label><input type="checkbox" name="write" style="width:auto"> write</label>
          <label><input type="checkbox" name="visible" style="width:auto"> visible</label>
          <label><input type="checkbox" name="interactive" style="width:auto"> interactive</label>
        </div>
      </details>
      <button class="primary" onclick="spawn()">Spawn session</button>
    </form>
    <h2>Sessions</h2>
    <div id="sessions" class="dim">none</div>
  </section>

  <section id="chat">
    <div id="msgs"><div id="chatEmpty">Select a session to chat, or spawn one.</div></div>
    <div id="composer">
      <input id="prompt" placeholder="message… (Enter to send)" onkeydown="if(event.key==='Enter')send()">
      <button class="primary" onclick="send()">Send</button>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let selected = null;
let sending = false;

const api = async (method, path, body) => {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json' },
                                body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const esc = (s) => s.replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function refreshNodes() {
  try {
    const nodes = await api('GET', '/api/nodes');
    $('#nodes').innerHTML = nodes.map((n) => n.alive
      ? `<div class="card"><b>${n.name}</b> <span class="ok">●</span> v${esc(String(n.version))}<br>
         <span class="dim">cpu ${n.cpu} · free ${n.mem_available_mb} MB / ${n.mem_total_mb} MB · up ${n.uptime_s}s
         · ${n.sessions.length} session(s)${n.tags?.length ? ' · ' + n.tags.join(',') : ''}</span></div>`
      : `<div class="card"><b>${n.name}</b> <span class="bad">●</span><br><span class="dim">${esc(n.error || 'dead')}</span></div>`
    ).join('');
  } catch (e) { $('#nodes').textContent = 'fleet probe failed: ' + e.message; }
  try {
    const o = await api('GET', '/api/reconcile');
    $('#orphans').innerHTML = o.length
      ? o.map((x) => `<div class="card"><b>${x.id}</b><br><span class="dim">pid ${x.pid ?? '—'} · alive ${x.pidAlive === null ? 'unknown (remote)' : x.pidAlive}${x.node ? ' · ' + x.node : ''}</span></div>`).join('')
      : '<span class="dim">none</span>';
  } catch { /* journal empty */ }
}

async function refreshSessions() {
  try {
    const list = await api('GET', '/api/sessions');
    $('#sessions').innerHTML = list.length ? list.map((s) => `
      <div class="card sess ${s.id === selected ? 'sel' : ''}" onclick="select('${s.id}')">
        <div class="row"><b>${s.id}</b><span class="${s.alive === false ? 'bad' : 'ok'}">●</span></div>
        <span class="dim">${s.provider}${s.node ? ' @ ' + s.node : ''} · turns ${s.turns}
        ${s.pid ? ' · pid ' + s.pid : ''}${s.usage ? ' · $' + s.usage.cost_usd.toFixed(3) : ''}</span>
        <div class="row" style="margin-top:4px"><button onclick="event.stopPropagation();closeSess('${s.id}')">close</button></div>
      </div>`).join('') : '<span class="dim">none — spawn one above</span>';
  } catch (e) { $('#sessions').textContent = e.message; }
}

async function refreshChat() {
  if (!selected) return;
  try {
    const { messages } = await api('GET', `/api/sessions/${selected}/log`);
    $('#msgs').innerHTML = messages.map((m) =>
      `<div class="msg ${m.role}"><div class="who">${m.role} · ${new Date(m.ts).toLocaleTimeString()}</div>${esc(m.text)}</div>`
    ).join('') + (sending ? '<div class="msg assistant spin">…thinking</div>' : '');
    $('#msgs').scrollTop = $('#msgs').scrollHeight;
  } catch { /* closed */ }
}

function select(id) { selected = id; refreshSessions(); refreshChat(); }

async function spawn() {
  const f = new FormData($('#spawnForm'));
  const v = (k) => (f.get(k) || '').toString().trim() || undefined;
  try {
    const desc = await api('POST', '/api/sessions', {
      provider: v('provider'), model: v('model'), effort: v('effort'),
      node: v('node'), project: v('project'), profile: v('profile'),
      write: f.get('write') === 'on', visible: f.get('visible') === 'on', interactive: f.get('interactive') === 'on',
    });
    select(desc.id);
  } catch (e) { alert('spawn failed: ' + e.message); }
}

async function send() {
  const box = $('#prompt');
  const text = box.value.trim();
  if (!text || !selected || sending) return;
  box.value = '';
  sending = true;
  refreshChat();
  try { await api('POST', `/api/sessions/${selected}/send`, { prompt: text }); }
  catch (e) { alert('send failed: ' + e.message); }
  sending = false;
  refreshChat(); refreshSessions();
}

async function closeSess(id) {
  try { await api('POST', `/api/sessions/${id}/close`, {}); } catch {}
  if (selected === id) { selected = null; $('#msgs').innerHTML = '<div id="chatEmpty">Session closed.</div>'; }
  refreshSessions();
}

refreshNodes(); refreshSessions();
setInterval(refreshNodes, 7000);
setInterval(refreshSessions, 4000);
setInterval(refreshChat, 2500);
</script>
</body>
</html>
